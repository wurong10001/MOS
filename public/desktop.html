<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#003b5c">
  <meta name="description" content="MOS 云系统桌面">
  <title>MOS 云系统桌面</title>
  <link rel="stylesheet" href="/assets/system.css">
</head>
<body class="desktop-os">
  <div id="desktop">
    <div id="wallpaper-layer" aria-hidden="true"></div>
    <div id="desktop-ui-layer">
  <main class="desktop-screen">
    <header class="system-bar">
      <div class="system-menu">
        <a class="system-logo" href="/" aria-label="MOS 桌面">m</a>
        <strong>MOS</strong>
        <span class="menu-divider"></span>
        <span>桌面</span>
        <span>文件</span>
        <span>显示</span>
        <span><a href="/repo.html" style="color:inherit;text-decoration:none">软件源</a></span>
        <span><a href="/store.html" style="color:inherit;text-decoration:none">应用商店</a></span>
      </div>
      <div class="system-status" aria-label="系统状态">
        <span class="status-symbol">⌁</span>
        <span class="status-symbol">◖</span>
        <span class="status-battery"><i></i></span>
        <span class="status-date">周五 10月16日</span>
      </div>
    </header>

    <section class="desktop-welcome" aria-label="桌面欢迎信息">
      <div class="welcome-mark">m</div>
      <div class="desktop-caption">MOS CLOUD DESKTOP</div>
      <h1>一个属于你的空间</h1>
      <p>桌面已准备就绪。应用将在这里与你相遇。</p>
    </section>

    <footer class="desktop-dock" aria-label="应用程序坞">
      <a class="dock-app" href="/store.html">应用商店</a>
      <a class="dock-app" href="/repo.html">软件源</a>
    </footer>
  </main>
    </div>
  </div>
  <script type="module">
    import { mountWallpaper } from '/assets/theme_host.js';
    const layer = document.getElementById('wallpaper-layer');
    mountWallpaper(layer);
    document.addEventListener('mos-wallpaper-changed', () => mountWallpaper(layer));
  </script>
</body>
</html>
