<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#003b5c">
  <meta name="description" content="MOS 云系统触屏桌面">
  <title>MOS 云系统 - 触屏桌面</title>
  <link rel="stylesheet" href="/assets/system.css">
</head>
<body class="touch-os">
  <main class="touch-screen">
    <section class="touch-widgets" aria-label="桌面小组件">
      <div class="touch-date-widget">
        <span class="touch-weekday">星期五</span>
        <strong>10月16日</strong>
      </div>
      <div class="touch-cloud-widget">
        <span class="cloud-widget-mark">m</span>
        <span class="cloud-widget-label">MOS CLOUD</span>
        <strong>你的云端空间</strong>
        <small>桌面已准备就绪</small>
      </div>
    </section>

    <section class="touch-icon-grid" aria-label="应用图标位置">
      <span class="touch-icon-slot" aria-label="应用图标预留位置 1"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 2"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 3"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 4"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 5"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 6"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 7"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 8"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 9"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 10"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 11"></span>
      <span class="touch-icon-slot" aria-label="应用图标预留位置 12"></span>
    </section>

    <footer class="touch-bottom">
      <div class="touch-page-dots" aria-label="第 1 页，共 2 页"><i class="selected"></i><i></i></div>
      <nav class="touch-dock" aria-label="Dock 图标位置">
        <span class="touch-icon-slot" aria-label="Dock 图标预留位置 1"></span>
        <span class="touch-icon-slot" aria-label="Dock 图标预留位置 2"></span>
        <span class="touch-icon-slot" aria-label="Dock 图标预留位置 3"></span>
        <span class="touch-icon-slot" aria-label="Dock 图标预留位置 4"></span>
      </nav>
    </footer>
    <div class="touch-home-indicator" aria-hidden="true"></div>
  </main>
  <script>
    (() => {
      const screen = window.screen;
      const updateSafeArea = () => {
        const shortSide = Math.min(screen.width, screen.height);
        const landscape = window.matchMedia("(orientation: landscape)").matches;
        const inlineInset = Math.min(30, Math.max(16, Math.round(shortSide * 0.055)));
        const blockInset = Math.min(30, Math.max(12, Math.round(shortSide * (landscape ? 0.06 : 0.035))));

        document.documentElement.style.setProperty("--ratio-safe-inline", `${inlineInset}px`);
        document.documentElement.style.setProperty("--ratio-safe-block", `${blockInset}px`);
        document.documentElement.dataset.orientation = landscape ? "landscape" : "portrait";
      };

      updateSafeArea();
      window.addEventListener("resize", updateSafeArea);
      window.addEventListener("orientationchange", updateSafeArea);
    })();
  </script>
</body>
</html>
