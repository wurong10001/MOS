<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#003b5c">
  <meta name="description" content="MOS 云系统触屏桌面">
  <title>MOS 云系统 - 触屏桌面</title>
  <link rel="stylesheet" href="/assets/system.css">
</head>
<body class="touch-os">
  <div id="desktop">
    <div id="wallpaper-layer" aria-hidden="true"></div>
    <div id="desktop-ui-layer">
  <main class="touch-screen">
    <section class="touch-widgets" aria-label="桌面小组件">
      <div class="touch-date-widget">
        <span class="touch-weekday">星期五</span>
        <strong>10月16日</strong>
      </div>
      <a class="touch-cloud-widget" href="/store.html" aria-label="打开 MOS 应用商店">
        <span class="cloud-widget-mark">m</span>
        <span class="cloud-widget-label">MOS CLOUD</span>
        <strong>你的云端空间</strong>
        <small>点按进入应用商店</small>
      </a>
    </section>

    <section class="touch-icon-grid" id="app-grid" aria-label="应用图标"></section>

    <footer class="touch-bottom">
      <div class="touch-page-dots" aria-label="第 1 页，共 1 页"><i class="selected"></i></div>
      <nav class="touch-dock" aria-label="程序坞"></nav>
    </footer>
    <div class="touch-home-indicator" aria-hidden="true"></div>
  </main>
    </div>
  </div>
  <script>
    (() => {
      const screen = window.screen;
      const updateSafeArea = () => {
        const shortSide = Math.min(screen.width, screen.height);
        const landscape = window.matchMedia("(orientation: landscape)").matches;
        const inlineInset = Math.min(30, Math.max(16, Math.round(shortSide * 0.055)));
        const blockInset = Math.min(30, Math.max(12, Math.round(shortSide * (landscape ? 0.06 : 0.035))));

        document.documentElement.style.setProperty("--ratio-safe-inline", `${inlineInset}px`);
        document.documentElement.style.setProperty("--ratio-safe-block", `${blockInset}px`);
        document.documentElement.dataset.orientation = landscape ? "landscape" : "portrait";
      };

      updateSafeArea();
      window.addEventListener("resize", updateSafeArea);
      window.addEventListener("orientationchange", updateSafeArea);
    })();
  </script>
  <script type="module">
    import { mountWallpaper } from '/assets/theme_host.js';
    const layer = document.getElementById('wallpaper-layer');
    mountWallpaper(layer);
    document.addEventListener('mos-wallpaper-changed', () => mountWallpaper(layer));

    // 桌面应用注册表：icon 为 null（未配置图标）时渲染空图标，图标下方显示程序名。
    // 后续接入图标包时，仅需把 app.icon 换成图标包解析出的 URL。
    const MOS_APPS = [
      { id: 'appstore', name: '应用商店', url: '/store.html', icon: null },
    ];
    const grid = document.getElementById('app-grid');
    for (const app of MOS_APPS) {
      const a = document.createElement('a');
      a.className = 'touch-icon-slot touch-app-slot';
      a.href = app.url;
      a.setAttribute('aria-label', app.name);
      const box = document.createElement('span');
      box.className = 'app-tile-icon';
      if (app.icon) {
        const img = document.createElement('img');
        img.src = app.icon;
        img.alt = '';
        box.appendChild(img);
      }
      const label = document.createElement('span');
      label.className = 'app-tile-name';
      label.textContent = app.name;
      a.append(box, label);
      grid.appendChild(a);
    }
  </script>
</body>
</html>
